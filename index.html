<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我們的日子">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#fbf6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1517" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>我們的日子</title>
<script>
/* LINE 內建瀏覽器會擋 Google 登入：自動改用手機預設瀏覽器開啟 */
(function(){var u=navigator.userAgent;if(/\bLine\//i.test(u)&&!/openExternalBrowser=1/.test(location.search)){location.replace(location.href.split('#')[0]+(location.search?'&':'?')+'openExternalBrowser=1');}})();
</script>
<style>
:root{
  --bg:#fff4f6;--bg2:#fdeef7;--card:#ffffff;--ink:#3a2530;--mute:#9a8490;--line:#f6dfe6;
  --rose:#e0527a;--rose-soft:#ffe3ea;--amber:#d08a1f;--amber-soft:#fff0d2;--plum:#8a5aa6;--shadow:0 6px 18px rgba(224,82,122,.10);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1c1517;--bg2:#221820;--shadow:none;--card:#2a2024;--ink:#f3e9ec;--mute:#a8969c;--line:#3d2f34;
  --rose:#e8718e;--rose-soft:#47262f;--amber:#e3ac55;--amber-soft:#43341d;--plum:#d3a9cd;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--bg),var(--bg2)) fixed;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:16px;line-height:1.5}
body{padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 84px)}
#view{max-width:560px;margin:0 auto}
h1{font-size:30px;margin:0 0 2px;letter-spacing:.02em;font-family:"Songti TC","Noto Serif TC",serif;font-weight:700}
h2{font-size:15px;margin:22px 4px 8px;color:var(--ink);font-weight:700;letter-spacing:.04em}
.sub{color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:10px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
.item{padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0;padding-bottom:0}
.item:first-child{padding-top:0}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--rose-soft);color:var(--rose);font-weight:600;white-space:nowrap}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.note{color:var(--mute);font-size:14px;white-space:pre-wrap;word-break:break-word}
.empty{color:var(--mute);font-size:14px;text-align:center;padding:6px 0}
.empty b{display:block;font-size:30px;font-weight:400;margin-bottom:2px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.btn{background:var(--rose);color:#fff;border-radius:99px;padding:11px 16px;font-weight:600;min-height:44px}
.btn.ghost{background:var(--rose-soft);color:var(--rose)}
.btn.plain{background:transparent;color:var(--mute);border:1px solid var(--line)}
.btn.sm{padding:6px 14px;min-height:34px;font-size:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns .btn{flex:1}
.banner{background:linear-gradient(135deg,#ffb347,#ff7fa3);color:#fff;border-radius:22px;padding:16px;margin:0 0 10px;box-shadow:var(--shadow)}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#ff8fab,#c58be0);color:#fff;border-radius:26px;padding:20px 20px 18px;margin-bottom:12px;box-shadow:var(--shadow)}
.hero .sub{color:#fff;opacity:.9}
.hero h1{font-size:34px}
.hero .pair{display:inline-block;margin-top:8px;background:rgba(255,255,255,.25);border-radius:99px;padding:4px 14px;font-size:14px;font-weight:600}
.hero .deco{position:absolute;right:14px;top:14px;font-size:38px;letter-spacing:-6px;line-height:1}
.hero .spark{position:absolute;right:22px;bottom:12px;font-size:18px;opacity:.9}
.title{display:flex;align-items:center;gap:8px}
.title span{font-size:30px}
.banner b{display:block;font-size:17px;margin-bottom:2px}
.banner span{font-size:14px;opacity:.92}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);z-index:5}
nav button{flex:1;padding:6px 0;font-size:11px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
nav{border-radius:24px 24px 0 0;box-shadow:0 -4px 18px rgba(224,82,122,.08)}
nav .ic{font-size:22px;line-height:1.2;padding:2px 16px;border-radius:99px;filter:grayscale(1);opacity:.55;transition:all .2s}
nav button.on .ic{filter:none;opacity:1;background:var(--rose-soft);transform:scale(1.08)}
nav button.on{color:var(--rose);font-weight:600}
/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.calhead b{font-size:19px}
.calhead button{width:44px;height:44px;font-size:22px;color:var(--rose)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.wd{font-size:12px;color:var(--mute);padding:4px 0}
.day{aspect-ratio:1/1.05;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px}
.day.today{box-shadow:inset 0 0 0 1.5px var(--rose)}
.day.sel{background:var(--rose-soft);color:var(--rose);font-weight:700}
.dots{display:flex;gap:1px;height:11px}
.em{font-style:normal;font-size:9px;line-height:11px}
.dot{width:6px;height:6px;border-radius:50%}
.d-rec{background:var(--rose)}.d-bk{background:var(--amber)}.d-sp{background:var(--plum)}.d-di{background:var(--mute)}
.day.sel .dot{background:#fff}
.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--mute);margin:10px 4px 0}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--shadow);position:relative}
.stat .e{position:absolute;right:12px;top:10px;font-size:24px}
.stat .n{font-size:34px;font-weight:700;line-height:1.1;color:var(--rose);font-variant-numeric:tabular-nums}
.stat .n small{font-size:14px;color:var(--mute);font-weight:500;margin-left:2px}
.stat .l{font-size:13px;color:var(--mute)}
.stat .p{font-size:12px;color:var(--mute);margin-top:4px}
.chart{display:flex;align-items:flex-end;gap:4px;height:150px;margin-top:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mute)}
.bar i{display:block;width:100%;background:linear-gradient(180deg,#ff8fab,var(--rose));border-radius:8px 8px 3px 3px;min-height:2px}
.bar i.zero{background:var(--line)}
.bar em{font-style:normal;margin-bottom:2px;color:var(--ink);font-variant-numeric:tabular-nums}
.bar span{margin-top:4px}
/* forms */
#mask{position:fixed;inset:0;background:rgba(20,10,14,.45);z-index:10;display:none;align-items:flex-end}
#mask.on{display:flex}
#sheet{background:var(--bg);width:100%;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;
  padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:92vh;overflow:auto}
#sheet h3{margin:0 0 12px;font-size:19px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 2px 4px}
input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:11px 12px;width:100%;min-height:46px;-webkit-appearance:none;appearance:none}
textarea{min-height:110px;resize:vertical}
input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0;-webkit-appearance:auto;appearance:auto;accent-color:var(--rose)}
.check{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15px;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;white-space:nowrap}
#toast.on{opacity:1}
#lock{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px}
#lock.on{display:flex}
#lock input{max-width:220px;text-align:center;font-size:24px;letter-spacing:.4em}
.year{font-weight:700;color:var(--plum);font-size:14px;margin-bottom:4px}
#gate{position:fixed;inset:0;background:var(--bg);z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px;text-align:center}
#gate.off{display:none}
#gate .note{max-width:320px}
.gbtn{display:inline-flex;align-items:center;gap:10px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:11px 20px;font-weight:600;min-height:46px;box-shadow:var(--shadow)}
.gbtn svg{width:20px;height:20px}
.spin{width:28px;height:28px;border:3px solid var(--rose-soft);border-top-color:var(--rose);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.offline{position:fixed;top:calc(env(safe-area-inset-top) + 6px);left:50%;transform:translateX(-50%);background:var(--amber-soft);color:var(--amber);font-size:12px;font-weight:600;padding:3px 12px;border-radius:99px;z-index:6;display:none}
.offline.on{display:block}
.ro{background:var(--bg2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;min-height:46px}
</style>
</head>
<body>
<div id="view"></div>
<div id="offline" class="offline">離線中 · 連線後會自動同步</div>

<nav id="nav">
  <button data-act="tab" data-v="home"><span class="ic">💗</span>今天</button>
  <button data-act="tab" data-v="cal"><span class="ic">📅</span>行事曆</button>
  <button data-act="tab" data-v="stats"><span class="ic">📊</span>統計</button>
  <button data-act="tab" data-v="set"><span class="ic">⚙️</span>設定</button>
</nav>

<div id="mask"><div id="sheet"></div></div>
<div id="toast"></div>
<div id="gate"><div class="spin"></div><div class="sub">載入中…</div></div>
<div id="lock">
  <div style="font-size:56px">🌭💞🙊</div>
  <h1>我們的日子</h1>
  <div class="sub">請輸入密碼</div>
  <input id="pinIn" type="password" inputmode="numeric" autocomplete="off">
  <button class="btn" data-act="unlock">解鎖</button>
</div>

<script type="module">
import {firebaseConfig,MEMBERS,SPACE} from './firebase-config.js';
const FB='https://www.gstatic.com/firebasejs/10.12.2/';

/* ---------- 資料（記憶體中的鏡像，由 Firestore 即時更新） ---------- */
const def=()=>({settings:{a:'老公',b:'老婆'},records:[],bookings:[],specials:[],diary:{}});
let S=def();
let me=null,myEmail='';           // me = 'a' | 'b'
let db=null,auth=null,F=null,A=null;
const PIN_KEY='ourdays.pin',OLD_KEY='ourdays.v1',MIG_KEY='ourdays.migrated';
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){}};
const getPin=()=>lsGet(PIN_KEY)||'';

const col=n=>F.collection(db,'spaces',SPACE,n);
const dref=(n,id)=>F.doc(db,'spaces',SPACE,n,id);
const spaceRef=()=>F.doc(db,'spaces',SPACE);
const plain=o=>{const x=JSON.parse(JSON.stringify(o));delete x.id;return x;};
function w(p){p.catch(e=>{console.error(e);toast(e.code==='permission-denied'?'沒有寫入權限':'同步失敗，請稍後再試');});}
const put=(n,o)=>w(F.setDoc(dref(n,o.id),{...plain(o),by:me,ts:Date.now()}));
const remove=(n,id)=>w(F.deleteDoc(dref(n,id)));

/* ---------- 工具 ---------- */
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const today=()=>fmt(new Date());
const WD=['日','一','二','三','四','五','六'];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const nice=ds=>{const d=parse(ds);return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 週'+WD[d.getDay()];};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800);}

const recsOn=ds=>S.records.filter(r=>r.date===ds).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
const bksOn=ds=>S.bookings.filter(r=>r.date===ds).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
const spOn=ds=>S.specials.filter(s=>s.yearly?(s.date.slice(5)===ds.slice(5)&&s.date<=ds):s.date===ds);
const hasDiary=ds=>{const d=S.diary[ds];return !!(d&&((d.a||'').trim()||(d.b||'').trim()));};

/* ---------- 畫面狀態 ---------- */
let tab='home',sel=today(),calY=new Date().getFullYear(),calM=new Date().getMonth(),statY=new Date().getFullYear();

function render(){
  const v=$('view');
  v.innerHTML=tab==='home'?vHome():tab==='cal'?vCal():tab==='stats'?vStats():vSet();
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===tab));
}
/* 雲端資料變動時重繪（避開正在輸入的欄位與開著的表單） */
function refresh(){
  const ae=document.activeElement;
  if(ae&&ae.dataset&&ae.dataset.name)return;
  render();
  if($('mask').classList.contains('on')&&!sheetCb&&sheetDay){const st=$('sheet').scrollTop;showDay(sheetDay);$('sheet').scrollTop=st;}
}

/* ---------- 單日內容（今天、行事曆共用） ---------- */
function dayDetail(ds){
  const recs=recsOn(ds),bks=bksOn(ds),di=S.diary[ds]||{};
  let h='';
  if(bks.length){
    h+='<h2>💌 預約</h2><div class="card">'+bks.map(b=>
      '<div class="item"><div class="row"><span class="tag amber">'+esc(b.time||'時間未定')+'</span>'+
      '<div class="grow note">'+esc(b.note||'兩人時光')+'</div></div>'+
      '<div class="btns" style="margin-top:8px"><button class="btn sm ghost" data-act="done-bk" data-id="'+b.id+'">✅ 完成，轉為紀錄</button>'+
      '<button class="btn sm plain" data-act="edit-bk" data-id="'+b.id+'">修改</button></div></div>').join('')+'</div>';
  }
  h+='<h2>💗 紀錄</h2><div class="card">';
  h+=recs.length?recs.map(r=>
    '<div class="item"><button class="row" style="width:100%;text-align:left" data-act="edit-rec" data-id="'+r.id+'">'+
    '<span class="tag">'+esc(r.time||'—')+'</span><div class="grow"><b>'+(r.dur?r.dur+' 分鐘':'未記錄時間長度')+'</b>'+
    (r.note?'<div class="note">'+esc(r.note)+'</div>':'')+'</div><span class="sub">›</span></button></div>').join('')
    :'<div class="empty"><b>🌱</b>這天還沒有紀錄</div>';
  h+='<div class="btns"><button class="btn" data-act="add-rec" data-d="'+ds+'">💗 新增紀錄</button>'+
     '<button class="btn ghost" data-act="add-bk" data-d="'+ds+'">💌 預約</button></div></div>';
  h+='<h2>📖 共同日記</h2><div class="card">';
  if(hasDiary(ds)){
    h+=['a','b'].map(k=>(di[k]||'').trim()?'<div class="item"><div class="year">'+esc(S.settings[k])+'</div><div class="note" style="color:var(--ink)">'+esc(di[k])+'</div></div>':'').join('');
  }else h+='<div class="empty"><b>✏️</b>這天還沒有日記</div>';
  const mine=(di[me]||'').trim();
  h+='<div class="btns"><button class="btn ghost" data-act="edit-diary" data-d="'+ds+'">'+(mine?'✏️ 編輯我的日記':'✏️ 寫我的日記')+'</button></div></div>';
  return h;
}

/* ---------- 歷年今日 ---------- */
function onThisDay(ds){
  const md=ds.slice(5),y0=+ds.slice(0,4),years=new Set();
  S.records.forEach(r=>{if(r.date.slice(5)===md&&r.date<ds)years.add(+r.date.slice(0,4));});
  Object.keys(S.diary).forEach(k=>{if(k.slice(5)===md&&k<ds&&hasDiary(k))years.add(+k.slice(0,4));});
  let h='<h2>🕰️ 歷年今日</h2><div class="card">';
  const ys=[...years].sort((a,b)=>b-a);
  if(!ys.length)h+='<div class="empty"><b>🌈</b>往年的這一天還沒有記趣，寫下今天的，明年就看得到了。</div>';
  else h+=ys.map(y=>{
    const d=y+'-'+md,recs=recsOn(d),di=S.diary[d]||{};
    let s='<div class="item"><div class="year">'+y+' 年（'+(y0-y)+' 年前）</div>';
    if(recs.length)s+='<div><span class="tag">'+recs.length+' 次</span> <span class="sub">'+recs.map(r=>esc(r.time||'')+(r.dur?' '+r.dur+'分':'')).join('、')+'</span></div>'+
      recs.filter(r=>r.note).map(r=>'<div class="note">'+esc(r.note)+'</div>').join('');
    ['a','b'].forEach(k=>{if((di[k]||'').trim())s+='<div class="note" style="margin-top:6px"><b>'+esc(S.settings[k])+'：</b>'+esc(di[k])+'</div>';});
    return s+'</div>';
  }).join('');
  return h+'</div>';
}

/* ---------- 今天 ---------- */
function nextOccur(s,t){
  if(!s.yearly)return s.date>=t?s.date:null;
  const y=+t.slice(0,4);let d=y+s.date.slice(4);
  if(d<t)d=(y+1)+s.date.slice(4);
  return d;
}
function vHome(){
  const t=today(),d=parse(t),sps=spOn(t);
  let h='<div class="hero"><div class="deco">🌭🙊</div><div class="sub">'+d.getFullYear()+' 年 · 週'+WD[d.getDay()]+'</div><h1>'+(d.getMonth()+1)+' 月 '+d.getDate()+' 日</h1>'+
    '<div class="pair">'+esc(S.settings.a)+' 💞 '+esc(S.settings.b)+'</div><div class="spark">✨</div></div>';
  sps.forEach(s=>{
    const n=s.yearly?(+t.slice(0,4))-(+s.date.slice(0,4)):0;
    h+='<div class="banner"><b>🎉 今天是「'+esc(s.name)+'」'+(n>0?' · 滿 '+n+' 年':'')+'</b><span>特別的日子，很適合安排一段只屬於兩人的親密時光。</span></div>';
  });
  h+=dayDetail(t)+onThisDay(t);
  const lim=fmt(addDays(d,60)),up=[];
  S.specials.forEach(s=>{const n=nextOccur(s,t);if(n&&n>t&&n<=lim)up.push({d:n,t:s.name,k:'sp'});});
  S.bookings.forEach(b=>{if(b.date>t)up.push({d:b.date,t:(b.time?b.time+' ':'')+(b.note||'兩人時光'),k:'bk'});});
  up.sort((a,b)=>a.d.localeCompare(b.d));
  if(up.length){
    h+='<h2>🎈 即將到來</h2><div class="card">'+up.slice(0,8).map(u=>{
      const n=Math.round((parse(u.d)-d)/864e5);
      return '<div class="item"><button class="row" style="width:100%;text-align:left" data-act="pick-day" data-d="'+u.d+'" data-go="1">'+
        '<span class="tag '+(u.k==='bk'?'amber':'')+'">'+(u.k==='bk'?'💌 預約':'⭐ 特別日')+'</span>'+

/* ---------- 統計 ---------- */
function rangeStat(a,b){
  const A=fmt(a),B=fmt(b),r=S.records.filter(x=>x.date>=A&&x.date<=B);
  return {n:r.length,min:r.reduce((s,x)=>s+(+x.dur||0),0)};
}
function vStats(){
  const now=parse(today()),y=now.getFullYear(),m=now.getMonth(),q=Math.floor(m/3);
  const ws=addDays(now,-((now.getDay()+6)%7));
  const P=[
    ['🌙','本週',rangeStat(ws,addDays(ws,6)),rangeStat(addDays(ws,-7),addDays(ws,-1)),'上週'],
    ['🌸','本月',rangeStat(new Date(y,m,1),new Date(y,m+1,0)),rangeStat(new Date(y,m-1,1),new Date(y,m,0)),'上月'],
    ['🍀','本季（Q'+(q+1)+'）',rangeStat(new Date(y,q*3,1),new Date(y,q*3+3,0)),rangeStat(new Date(y,q*3-3,1),new Date(y,q*3,0)),'上季'],
    ['🏆','今年',rangeStat(new Date(y,0,1),new Date(y,11,31)),rangeStat(new Date(y-1,0,1),new Date(y-1,11,31)),'去年']
  ];
  let h='<h1 class="title"><span>📊</span>統計</h1><div class="sub" style="margin-bottom:14px">每週從週一起算</div><div class="stats">'+P.map(p=>
    '<div class="stat"><span class="e">'+p[0]+'</span><div class="l">'+p[1]+'</div><div class="n">'+p[2].n+'<small>次</small></div>'+
    '<div class="p">'+p[4]+' '+p[3].n+' 次'+(p[2].min?' · 共 '+p[2].min+' 分':'')+'</div></div>').join('')+'</div>';

  const yr=S.records.filter(r=>r.date.slice(0,4)===String(statY));
  const by=Array(12).fill(0);yr.forEach(r=>by[+r.date.slice(5,7)-1]++);
  const mx=Math.max(1,...by),timed=yr.filter(r=>+r.dur>0),tot=timed.reduce((s,r)=>s+(+r.dur),0);
  h+='<div class="calhead" style="margin-top:18px"><button data-act="st-prev" aria-label="前一年">‹</button><b>'+statY+' 年每月次數</b><button data-act="st-next" aria-label="後一年">›</button></div>';
  h+='<div class="card"><div class="chart">'+by.map((n,i)=>
    '<div class="bar"><em>'+(n||'')+'</em><i class="'+(n?'':'zero')+'" style="height:'+(n?Math.max(4,n/mx*100):1)+'%"></i><span>'+(i+1)+'</span></div>').join('')+'</div></div>';
  const qs=[0,1,2,3].map(i=>by[i*3]+by[i*3+1]+by[i*3+2]);
  h+='<div class="card">'+
    '<div class="item row"><div class="grow">💗 全年次數</div><b>'+yr.length+' 次</b></div>'+
    '<div class="item row"><div class="grow">🍀 各季次數</div><b>'+qs.map((n,i)=>'Q'+(i+1)+' '+n).join(' · ')+'</b></div>'+
    '<div class="item row"><div class="grow">⏱️ 平均每次時間</div><b>'+(timed.length?Math.round(tot/timed.length)+' 分鐘':'—')+'</b></div>'+
    '<div class="item row"><div class="grow">🏅 最長一次</div><b>'+(timed.length?Math.max(...timed.map(r=>+r.dur))+' 分鐘':'—')+'</b></div>'+
    '<div class="item row"><div class="grow">⏳ 累計時間</div><b>'+(tot?(Math.floor(tot/60)?Math.floor(tot/60)+' 小時 ':'')+(tot%60)+' 分':'—')+'</b></div></div>';
  return h;
}

/* ---------- 備份 / 匯入 ---------- */
async function exportData(){
  const name='ourdays-backup-'+today()+'.json',text=JSON.stringify(S,null,1);
  try{
    const f=new File([text],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return;}
  }catch(e){if(e&&e.name==='AbortError')return;}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  toast('已匯出備份');
}
/* 把舊格式（localStorage / 備份檔）合併上傳；同 id 會覆蓋，日記只寫有內容的欄位 */
async function uploadAll(j){
  const ops=[];
  ['records','bookings','specials'].forEach(n=>(j[n]||[]).forEach(o=>{if(o&&o.id&&o.date)ops.push([dref(n,String(o.id)),{...plain(o),by:o.by||me,ts:o.ts||Date.now()},false]);}));
  Object.entries(j.diary||{}).forEach(([k,v])=>{
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!v)return;
    const x={};['a','b'].forEach(p=>{if((v[p]||'').trim())x[p]=v[p];});
    if(Object.keys(x).length)ops.push([dref('diary',k),x,true]);
  });
  if(j.settings&&(j.settings.a||j.settings.b))ops.push([spaceRef(),{a:j.settings.a||S.settings.a,b:j.settings.b||S.settings.b},true]);
  for(let i=0;i<ops.length;i+=400){
    const b=F.writeBatch(db);
    ops.slice(i,i+400).forEach(([r,d,m])=>m?b.set(r,d,{merge:true}):b.set(r,d));
    await b.commit();
  }
  return ops.length;
}
function importData(file){
  const fr=new FileReader();
  fr.onload=async()=>{
    let j;
    try{j=JSON.parse(fr.result);if(!j||!Array.isArray(j.records))throw 0;}catch(e){return toast('這不是有效的備份檔');}
    toast('上傳中…');
    try{await uploadAll(j);toast('匯入完成');}catch(e){console.error(e);toast('匯入失敗，請確認網路');}
  };
  fr.readAsText(file);
}
async function migrate(){
  const j=oldLocalData();if(!j)return;
  toast('上傳中…');
  try{await uploadAll(j);lsSet(MIG_KEY,'1');toast('舊資料已上傳');render();}
  catch(e){console.error(e);toast('上傳失敗，請確認網路');}
}

/* ---------- 登入畫面 ---------- */
const G_ICON='<svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>';
function gate(state,msg){
  const g=$('gate');
  if(state==='off'){g.classList.add('off');return;}
  g.classList.remove('off');
  const head='<div style="font-size:56px">🌭💞🙊</div><h1>我們的日子</h1>';
  if(state==='loading')g.innerHTML='<div class="spin"></div><div class="sub">'+(msg||'載入中…')+'</div>';
  else if(state==='setup')g.innerHTML=head+'<div class="note">尚未設定 Firebase。<br>請依照 README 的步驟，把設定貼到 <b>firebase-config.js</b>。</div>';
  else if(state==='login'){
    const inApp=/FBAN|FBAV|Instagram|Line\//i.test(navigator.userAgent);
    g.innerHTML=head+'<div class="sub">兩個人的小天地，請先登入</div>'+
      '<button class="gbtn" data-act="login">'+G_ICON+'使用 Google 帳號登入</button>'+
      (inApp?'<div class="note" style="color:var(--rose)">偵測到 App 內建瀏覽器，Google 可能會拒絕登入。請點右上角選單，改用 Safari 或 Chrome 開啟。</div>':'')+
      (msg?'<div class="note">'+esc(msg)+'</div>':'');
  }
  else if(state==='denied')g.innerHTML=head+'<div class="note">'+esc(myEmail)+'<br>這個帳號沒有權限使用。<br>請換成你們兩人設定好的 Google 帳號。</div>'+
      '<button class="btn plain" data-act="logout">換一個帳號</button>';
  else if(state==='error')g.innerHTML=head+'<div class="note">'+esc(msg||'發生錯誤')+'</div><button class="btn plain" onclick="location.reload()">重新整理</button>';
}

/* ---------- Firebase 連線 ---------- */
let unsubs=[],got=new Set(),started=false;
function stopListen(){unsubs.forEach(u=>u());unsubs=[];got=new Set();started=false;S=def();}
function onErr(e){
  console.error(e);
  if(e.code==='permission-denied'){stopListen();gate('denied');}
  else toast('同步中斷，請檢查網路');
}
function changed(n){
  got.add(n);
  if(got.size<5)return;
  if(!started){started=true;gate('off');render();return;}
  refresh();
}
function listen(){
  stopListen();
  ['records','bookings','specials'].forEach(n=>unsubs.push(F.onSnapshot(col(n),snap=>{
    S[n]=snap.docs.map(d=>({...d.data(),id:d.id}));changed(n);},onErr)));
  unsubs.push(F.onSnapshot(col('diary'),snap=>{
    const o={};snap.docs.forEach(d=>{o[d.id]=d.data();});S.diary=o;changed('diary');},onErr));
  unsubs.push(F.onSnapshot(spaceRef(),snap=>{
    S.settings=Object.assign(def().settings,snap.exists()?snap.data():{});changed('settings');},onErr));
}
async function login(){
  const p=new A.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
  try{await A.signInWithPopup(auth,p);}
  catch(e){
    if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'){
      try{await A.signInWithRedirect(auth,p);}catch(e2){gate('login','登入失敗：'+e2.code);}
    }else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')gate('login','登入失敗：'+e.code);
  }
}
async function boot(){
  lockIfNeeded();
  if(!firebaseConfig||!firebaseConfig.apiKey||/^YOUR/i.test(firebaseConfig.apiKey))return gate('setup');
  try{
    const [appM,authM,fsM]=await Promise.all([import(FB+'firebase-app.js'),import(FB+'firebase-auth.js'),import(FB+'firebase-firestore.js')]);
    A=authM;F=fsM;
    const app=appM.initializeApp(firebaseConfig);
    auth=A.getAuth(app);
    try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})});}
    catch(e){db=F.getFirestore(app);}
  }catch(e){console.error(e);return gate('error','無法載入，請確認網路連線後重新整理。');}
  A.getRedirectResult(auth).catch(e=>console.warn(e));
  const ma=String(MEMBERS.a||'').trim().toLowerCase(),mb=String(MEMBERS.b||'').trim().toLowerCase();
  A.onAuthStateChanged(auth,u=>{
    if(!u){stopListen();me=null;myEmail='';$('mask').classList.remove('on');gate('login');return;}
    myEmail=(u.email||'').toLowerCase();
    me=myEmail===ma?'a':myEmail===mb?'b':null;
    if(!me){stopListen();return gate('denied');}
    gate('loading','同步資料中…');
    listen();
  });
}
boot();

if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
