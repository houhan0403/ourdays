<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="字幕跑馬燈">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#fbf6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1517" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="mq-180.png">
<link rel="icon" type="image/png" href="mq-180.png">
<title>字幕跑馬燈</title>
<script>
/* LINE 內建瀏覽器會擋 Google 登入：自動改用手機預設瀏覽器開啟 */
(function(){var u=navigator.userAgent;if(/\bLine\//i.test(u)&&!/openExternalBrowser=1/.test(location.search)){location.replace(location.href.split('#')[0]+(location.search?'&':'?')+'openExternalBrowser=1');}})();
</script>
<style>
:root{
  --bg:#fff4f6;--bg2:#fdeef7;--card:#ffffff;--ink:#3a2530;--mute:#9a8490;--line:#f6dfe6;
  --rose:#e0527a;--rose-soft:#ffe3ea;--amber:#d08a1f;--amber-soft:#fff0d2;--plum:#8a5aa6;--shadow:0 6px 18px rgba(224,82,122,.10);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1c1517;--bg2:#221820;--shadow:none;--card:#2a2024;--ink:#f3e9ec;--mute:#a8969c;--line:#3d2f34;
  --rose:#e8718e;--rose-soft:#47262f;--amber:#e3ac55;--amber-soft:#43341d;--plum:#d3a9cd;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--bg),var(--bg2)) fixed;color:var(--ink);
  font-family:-apple-system,system-ui,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:16px;line-height:1.5}
body{padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 84px)}
#view{max-width:560px;margin:0 auto}
h1{font-size:30px;margin:0 0 2px;letter-spacing:.02em;font-weight:700}
h2{font-size:15px;margin:22px 4px 8px;color:var(--ink);font-weight:700;letter-spacing:.04em}
.sub{color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:10px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
.item{padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0;padding-bottom:0}
.item:first-child{padding-top:0}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--rose-soft);color:var(--rose);font-weight:600;white-space:nowrap}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.note{color:var(--mute);font-size:14px;white-space:pre-wrap;word-break:break-word}
.empty{color:var(--mute);font-size:14px;text-align:center;padding:6px 0}
.empty b{display:block;font-size:30px;font-weight:400;margin-bottom:2px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.btn{background:var(--rose);color:#fff;border-radius:99px;padding:11px 16px;font-weight:600;min-height:44px}
.btn.ghost{background:var(--rose-soft);color:var(--rose)}
.btn.plain{background:transparent;color:var(--mute);border:1px solid var(--line)}
.btn.sm{padding:6px 14px;min-height:34px;font-size:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns .btn{flex:1}
.banner{background:linear-gradient(135deg,#ffb347,#ff7fa3);color:#fff;border-radius:22px;padding:16px;margin:0 0 10px;box-shadow:var(--shadow)}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#ff8fab,#c58be0);color:#fff;border-radius:26px;padding:20px 20px 18px;margin-bottom:12px;box-shadow:var(--shadow)}
.hero .sub{color:#fff;opacity:.9}
.hero h1{font-size:34px}
.hero .pair{display:inline-block;margin-top:8px;background:rgba(255,255,255,.25);border-radius:99px;padding:4px 14px;font-size:14px;font-weight:600}
.hero .deco{position:absolute;right:14px;top:14px;font-size:38px;letter-spacing:-6px;line-height:1}
.hero .spark{position:absolute;right:22px;bottom:12px;font-size:18px;opacity:.9}
.title{display:flex;align-items:center;gap:8px}
.title span{font-size:30px}
.banner b{display:block;font-size:17px;margin-bottom:2px}
.banner span{font-size:14px;opacity:.92}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);z-index:5}
nav button{flex:1;padding:6px 0;font-size:11px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
nav{border-radius:24px 24px 0 0;box-shadow:0 -4px 18px rgba(224,82,122,.08)}
nav .ic{font-size:22px;line-height:1.2;padding:2px 12px;border-radius:99px;filter:grayscale(1);opacity:.55;transition:all .2s}
nav button.on .ic{filter:none;opacity:1;background:var(--rose-soft);transform:scale(1.08)}
nav button.on{color:var(--rose);font-weight:600}
/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.calhead b{font-size:19px}
.calhead button{width:44px;height:44px;font-size:22px;color:var(--rose)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.wd{font-size:12px;color:var(--mute);padding:4px 0}
.day{aspect-ratio:1/1.05;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px}
.day.today{box-shadow:inset 0 0 0 1.5px var(--rose)}
.day.sel{background:var(--rose-soft);color:var(--rose);font-weight:700}
.dots{display:flex;gap:1px;height:11px}
.em{font-style:normal;font-size:9px;line-height:11px}
.dot{width:6px;height:6px;border-radius:50%}
.d-rec{background:var(--rose)}.d-bk{background:var(--amber)}.d-sp{background:var(--plum)}.d-di{background:var(--mute)}
.day.sel .dot{background:#fff}
.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--mute);margin:10px 4px 0}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--shadow);position:relative}
.stat .e{position:absolute;right:12px;top:10px;font-size:24px}
.stat .n{font-size:34px;font-weight:700;line-height:1.1;color:var(--rose);font-variant-numeric:tabular-nums}
.stat .n small{font-size:14px;color:var(--mute);font-weight:500;margin-left:2px}
.stat .l{font-size:13px;color:var(--mute)}
.stat .p{font-size:12px;color:var(--mute);margin-top:4px}
.chart{display:flex;align-items:flex-end;gap:4px;height:150px;margin-top:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mute)}
.bar i{display:block;width:100%;background:linear-gradient(180deg,#ff8fab,var(--rose));border-radius:8px 8px 3px 3px;min-height:2px}
.bar i.zero{background:var(--line)}
.bar em{font-style:normal;margin-bottom:2px;color:var(--ink);font-variant-numeric:tabular-nums}
.bar span{margin-top:4px}
/* forms */
#mask{position:fixed;inset:0;background:rgba(20,10,14,.45);z-index:10;display:none;align-items:flex-end}
#mask.on{display:flex}
#sheet{background:var(--bg);width:100%;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;
  padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:92vh;overflow:auto}
#sheet h3{margin:0 0 12px;font-size:19px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 2px 4px}
input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:11px 12px;width:100%;min-height:46px;-webkit-appearance:none;appearance:none}
textarea{min-height:110px;resize:vertical}
input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0;-webkit-appearance:auto;appearance:auto;accent-color:var(--rose)}
.check{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15px;color:var(--ink)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
input[type=date],input[type=time]{min-width:0;max-width:100%;display:block}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:40;white-space:nowrap}
#toast.on{opacity:1}
#lock{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px}
#lock.on{display:flex}
#lock{text-align:center}
#lock input{max-width:240px;text-align:center;font-size:24px;letter-spacing:.3em}
#lock input::placeholder{font-size:15px;letter-spacing:0}
#lock .btn{min-width:240px}
.chat{display:flex;flex-direction:column;gap:8px;position:relative;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.mi{display:flex;flex-direction:column;gap:8px;flex:none}
.chatmore{font-size:12px;color:var(--mute);text-align:center;margin-bottom:8px}
.msg{display:flex;align-items:flex-end;gap:6px}
.msg.me{flex-direction:row-reverse}
.bub{max-width:76%;padding:8px 13px;border-radius:18px 18px 18px 6px;white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.45;background:var(--bg2);border:1px solid var(--line);text-align:left}
.msg.me .bub{background:var(--rose);color:#fff;border-color:transparent;border-radius:18px 18px 6px 18px}
.msg time{font-size:11px;color:var(--mute);white-space:nowrap;padding-bottom:2px}
.who{font-size:12px;color:var(--mute);margin:2px 0 -4px 6px}
.chatin{display:flex;gap:8px;align-items:flex-end;margin-top:14px}
.chatin textarea{min-height:44px;height:44px;max-height:120px;border-radius:22px;resize:none;padding:10px 14px}
.chatin .btn{flex:none;padding:11px 18px}
.moods{display:flex;gap:6px;flex-wrap:wrap}
.mood{font-size:24px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card)}
.mood.on{background:var(--rose-soft);border-color:var(--rose);box-shadow:0 0 0 2px var(--rose-soft)}
/* 偽裝首頁：跑馬燈 */
#lock.mq{padding:0;gap:0;background:#000;align-items:stretch;justify-content:center;text-align:left;overflow:hidden}
.mqstage{flex:1;display:flex;align-items:center;overflow:hidden;white-space:nowrap}
#mqText{display:inline-block;font-weight:800;white-space:nowrap;will-change:transform;line-height:1.2}
@keyframes mq{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
.mqgear{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:14px;width:44px;height:44px;font-size:22px;border-radius:50%;background:rgba(128,128,128,.25);opacity:.7}
.mqhint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 14px);left:0;right:0;text-align:center;color:rgba(160,160,160,.7);font-size:12px}
.mqpanel{position:absolute;left:0;right:0;bottom:0;background:#1b1b1f;color:#eee;border-radius:22px 22px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:88vh;overflow:auto;display:none}
.mqpanel.on{display:block}
.mqpanel h3{margin:0;font-size:18px}
.mqpanel label{color:#aaa}
#lock.mq input{max-width:none;text-align:left;font-size:16px;letter-spacing:0;background:#2a2a30;color:#fff;border-color:#3a3a42}
#lock.mq input[type=range]{-webkit-appearance:auto;appearance:auto;padding:0;min-height:30px;border:0;background:none;accent-color:#ffe14d}
#lock.mq .btn{min-width:0}
#lock.mq .btn.plain{color:#ccc;border-color:#44444c}
.mqrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid #55555e}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px #888}
.hsearch{display:flex;gap:8px;align-items:center;position:sticky;top:calc(env(safe-area-inset-top) + 4px);z-index:3;background:var(--bg);padding:6px 0}
.hsearch input{border-radius:22px;padding-left:16px}
.hday{padding:12px 0;border-bottom:1px dashed var(--line);white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.7}
.hday:last-child{border-bottom:0}
.hday:first-child{padding-top:0}
.hyear{font-weight:700;color:var(--plum);font-size:14px;text-align:center;margin:14px 0 4px;letter-spacing:.1em}
.hday mark{background:var(--amber-soft);color:var(--amber);border-radius:4px;padding:0 2px}
.year{font-weight:700;color:var(--plum);font-size:14px;margin-bottom:4px}
#gate{position:fixed;inset:0;background:var(--bg);z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px;text-align:center}
#gate.off{display:none}
#gate .note{max-width:320px}
.gbtn{display:inline-flex;align-items:center;gap:10px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:11px 20px;font-weight:600;min-height:46px;box-shadow:var(--shadow)}
.gbtn svg{width:20px;height:20px}
.spin{width:28px;height:28px;border:3px solid var(--rose-soft);border-top-color:var(--rose);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.offline{position:fixed;top:calc(env(safe-area-inset-top) + 6px);left:50%;transform:translateX(-50%);background:var(--amber-soft);color:var(--amber);font-size:12px;font-weight:600;padding:3px 12px;border-radius:99px;z-index:6;display:none}
.offline.on{display:block}
</style>
</head>
<body>
<div id="view"></div>
<div id="offline" class="offline">離線中 · 連線後會自動同步</div>

<nav id="nav">
  <button data-act="tab" data-v="home"><span class="ic">💗</span>今天</button>
  <button data-act="tab" data-v="cal"><span class="ic">📅</span>行事曆</button>
  <button data-act="tab" data-v="stats"><span class="ic">📊</span>統計</button>
  <button data-act="tab" data-v="hist"><span class="ic">📜</span>歷史紀錄</button>
  <button data-act="tab" data-v="set"><span class="ic">⚙️</span>設定</button>
</nav>

<div id="mask"><div id="sheet"></div></div>
<div id="toast"></div>
<div id="gate"><div class="spin"></div><div class="sub">載入中…</div></div>
<div id="lock"></div>

<script type="module">
import {firebaseConfig,MEMBERS,SPACE} from './firebase-config.js';
const FB='https://www.gstatic.com/firebasejs/10.12.2/';

/* ---------- 資料（記憶體中的鏡像，由 Firestore 即時更新） ----------
   settings: spaces/main {a,b,bda,bdb,wed,dat}
   records / bookings / specials: 各自一個 collection
   msgs（有話要說）: 每則留言一筆 {date,by,text,ts}
   journal（心情小記）: 每天一筆 {a:{text,mood,ts,hist}, b:{...}}，各自只寫自己那欄
   history（歷史紀錄）: 每天一筆 {date,text,ts}，凌晨 3 點後自動產生前一天的文字 */
const def=()=>({settings:{a:'老公',b:'老婆',bda:'',bdb:'',wed:'',dat:'',emja:'🍗',emjb:'🍉',histClr:''},records:[],bookings:[],specials:[],msgs:[],journal:{},history:{}});
let S=def();
let me=null,myEmail='';           // me = 'a' | 'b'，由 Google 登入的帳號決定
let db=null,auth=null,F=null,A=null;
const PIN_KEY='ourdays.pin',OLD_KEY='ourdays.v1',MIG_KEY='ourdays.migrated';
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){}};
/* 密碼只存在這支手機；沿用舊版（本機版）設定過的密碼 */
(()=>{if(!lsGet(PIN_KEY)){try{const p=(JSON.parse(lsGet(OLD_KEY))||{}).settings.pin;if(/^\d{4,8}$/.test(p||''))lsSet(PIN_KEY,p);}catch(e){}}})();
const getPin=()=>lsGet(PIN_KEY)||'';

const col=n=>F.collection(db,'spaces',SPACE,n);
const dref=(n,id)=>F.doc(db,'spaces',SPACE,n,id);
const spaceRef=()=>F.doc(db,'spaces',SPACE);
const plain=o=>{const x=JSON.parse(JSON.stringify(o));delete x.id;return x;};
function w(p){p.catch(e=>{console.error(e);toast(e.code==='permission-denied'?'沒有寫入權限':'同步失敗，請稍後再試');});}
const put=(n,o)=>w(F.setDoc(dref(n,o.id),{...plain(o),ts:Date.now()}));
const remove=(n,id)=>w(F.deleteDoc(dref(n,id)));
const setSettings=o=>w(F.setDoc(spaceRef(),o,{merge:true}));

/* ---------- 工具 ---------- */
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const today=()=>fmt(new Date());
const WD=['日','一','二','三','四','五','六'];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const nice=ds=>{const d=parse(ds);return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 週'+WD[d.getDay()];};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800);}
const DATE_RE=/^\d{4}-\d{2}-\d{2}$/;

const recsOn=ds=>S.records.filter(r=>r.date===ds).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
const bksOn=ds=>S.bookings.filter(r=>r.date===ds).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
function allSpecials(){
  const st=S.settings,x=[];
  if(st.bda)x.push({id:'auto-bda',name:st.a+'生日 🎂',date:st.bda,yearly:true,bday:true});
  if(st.bdb)x.push({id:'auto-bdb',name:st.b+'生日 🎂',date:st.bdb,yearly:true,bday:true});
  if(st.wed)x.push({id:'auto-wed',name:'結婚紀念日 💍',date:st.wed,yearly:true});
  if(st.dat)x.push({id:'auto-dat',name:'交往紀念日 💕',date:st.dat,yearly:true});
  return x.concat(S.specials);
}
const spOn=ds=>allSpecials().filter(s=>s.yearly?(s.date.slice(5)===ds.slice(5)&&s.date<=ds):s.date===ds);
const mineRec=r=>!r.by||r.by===me;   // 沒有標記作者的舊紀錄，視為可修改
/* 有話要說：每則留言一筆 */
const msgsOn=ds=>S.msgs.filter(m=>m.date===ds).sort((a,b)=>(a.ts||0)-(b.ts||0)||String(a.id).localeCompare(String(b.id)));
/* 心情小記：S.journal[日期][a|b] = {text,mood,ts,hist:[{text,mood,ts}]}，各自只能動自己的 */
const jOn=ds=>S.journal[ds]||{};
const jHas=(ds,k)=>{const e=jOn(ds)[k];return !!(e&&(e.text||'').trim());};
const jDay=ds=>jHas(ds,'a')||jHas(ds,'b');
const hasDiary=ds=>msgsOn(ds).length>0||jDay(ds);
const MOODS=['🥰','😊','😌','🤤','😴','😢','😠','🤒'];
const stamp=ts=>{const d=new Date(ts);return (d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes());};
function journalHtml(ds){
  const ot=me==='a'?'b':'a';
  const entry=(k,mine)=>{
    const e=jOn(ds)[k],has=jHas(ds,k),n=e?(e.hist||[]).length:0;
    return '<div class="item"><div class="row"><div class="year grow" style="margin:0">'+esc(S.settings[k])+(mine?'（我）':'')+(has&&e.mood?' '+e.mood:'')+'</div>'+
      (e&&e.ts?'<button class="btn sm plain" data-act="j-hist" data-d="'+ds+'" data-k="'+k+'">🕘 履歷</button>':'')+'</div>'+

          :'<div class="sub" style="margin-top:6px">'+(e&&e.ts?'已清空（'+stamp(e.ts)+'）':mine?'今天還沒寫':'對方還沒寫')+'</div>')+

function msgTime(ts,ds){

/* 「有話要說」的視窗最多顯示最新 8 則的高度，更早的往上捲動查看 */
const CHAT_MAX=8;
function fitChats(){
  document.querySelectorAll('.chat').forEach(c=>{
    const it=c.children,n=it.length;
    c.style.maxHeight='';
    if(n<=CHAT_MAX)return;
    const h=Math.min(c.scrollHeight-it[n-CHAT_MAX].offsetTop,Math.round(innerHeight*0.7));

/* 重畫目前畫面；當日視窗開著時一併更新並保留捲動位置與「有話要說」打到一半的字 */
function redraw(){
  const drafts={},ae=document.activeElement;let focusD=null,caret=0;
  document.querySelectorAll('.chatin textarea').forEach(t=>{if(t.value)drafts[t.closest('#sheet')?'s'+t.dataset.d:'v'+t.dataset.d]=t.value;});
  if(ae&&ae.closest&&ae.closest('.chatin')){focusD=(ae.closest('#sheet')?'s':'v')+ae.dataset.d;caret=ae.selectionStart||0;}
  const y=scrollY;
  render();scrollTo(0,y);
  if($('mask').classList.contains('on')&&sheetDay&&!sheetCb){const st=$('sheet').scrollTop;showDay(sheetDay);$('sheet').scrollTop=st;}
  document.querySelectorAll('.chatin textarea').forEach(t=>{

  });
}

/* ---------- 歷年今日 ---------- */
function onThisDay(ds){
  const md=ds.slice(5),y0=+ds.slice(0,4),years=new Set();
  S.records.forEach(r=>{if(r.date.slice(5)===md&&r.date<ds)years.add(+r.date.slice(0,4));});
  S.msgs.map(m=>m.date).concat(Object.keys(S.journal)).forEach(k=>{if(k&&k.slice(5)===md&&k<ds&&hasDiary(k))years.add(+k.slice(0,4));});
  let h='<h2>🕰️ 歷年今日</h2><div class="card">';
  const ys=[...years].sort((a,b)=>b-a);
  if(!ys.length)h+='<div class="empty"><b>🌈</b>往年的這一天還沒有記趣，寫下今天的，明年就看得到了。</div>';
  else h+=ys.map(y=>{
    const d=y+'-'+md,recs=recsOn(d);
    let s='<div class="item"><div class="year">'+y+' 年（'+(y0-y)+' 年前）</div>';
    if(recs.length)s+='<div><span class="tag">'+recs.length+' 次</span> <span class="sub">'+recs.map(r=>esc(r.time||'')+(r.dur?' '+r.dur+'分':'')).join('、')+'</span></div>'+
      recs.filter(r=>r.note).map(r=>'<div class="note">'+esc(r.note)+'</div>').join('');
    ['a','b'].forEach(k=>{if(jHas(d,k)){const e=jOn(d)[k];s+='<div class="note" style="margin-top:6px;color:var(--ink)"><b>📖 '+esc(S.settings[k])+(e.mood?' '+e.mood:'')+'：</b>'+esc(e.text)+'</div>';}});
    msgsOn(d).forEach(m=>{s+='<div class="note" style="margin-top:6px"><b>'+esc(S.settings[m.by]||'')+(m.ts?' '+msgTime(m.ts,d):'')+'：</b>'+esc(m.text)+'</div>';});

}

/* ---------- 歷史紀錄 ----------
   每天凌晨 3 點之後，第一支打開 App 的手機會把「前一天」的有話要說＋共同日記整理成文字存到雲端。
   最近 7 天若有人補寫或修改，會自動更新；更早的維持原樣。 */
const emj=k=>(S.settings['emj'+k]||'').trim()||(k==='a'?'🍗':'🍉');
function dayText(ds){
  const ms=msgsOn(ds).filter(m=>(m.text||'').trim()),js=['a','b'].filter(k=>jHas(ds,k));
  if(!ms.length&&!js.length)return '';
  const d=parse(ds),lines=['🗓️'+(d.getMonth()+1)+'/'+d.getDate()];
  ms.forEach(m=>lines.push(emj(m.by)+'：'+m.text.trim()));
  if(js.length){lines.push('<日記>');js.forEach(k=>lines.push(emj(k)+'：'+jOn(ds)[k].text.trim()));}
  return lines.join('\n');
}
let archBusy=false;
async function archiveDue(){
  if(archBusy||!started||!me||!db)return;
  const cut=fmt(addDays(new Date(Date.now()-3*3600e3),-1)),recent=fmt(addDays(parse(cut),-6));
  const dates=new Set(S.msgs.map(m=>m.date).concat(Object.keys(S.journal)));
  const ops=[];
  dates.forEach(ds=>{
    if(!DATE_RE.test(ds)||ds>cut)return;
    if(S.settings.histClr&&ds<=S.settings.histClr)return;   // 已清除過的日子不再產生
    const ex=S.history[ds];
    if(ex&&ds<recent)return;
    const t=dayText(ds);
    if(t&&(!ex||ex.text!==t))ops.push([ds,t]);
  });
  if(!ops.length)return;
  archBusy=true;
  try{
    for(let i=0;i<ops.length;i+=400){
      const b=F.writeBatch(db);
      ops.slice(i,i+400).forEach(([ds,t])=>b.set(dref('history',ds),{date:ds,text:t,ts:Date.now()}));
      await b.commit();
    }
  }catch(e){console.error(e);}
  archBusy=false;
}
setInterval(archiveDue,60*1000);
const histKeys=()=>Object.keys(S.history).filter(k=>DATE_RE.test(k)&&S.history[k].text).sort();
function histText(keys){
  let y='',out=[];
  keys.forEach(k=>{if(k.slice(0,4)!==y){y=k.slice(0,4);out.push('【'+y+' 年】');}out.push(S.history[k].text);});
  return out.join('\n\n');
}

function vHist(){

    '<div class="hsearch"><input id="hq" type="search" placeholder="🔍 輸入關鍵字搜尋" value="'+esc(hq)+'" autocomplete="off">'+
    '<button class="btn sm ghost" style="flex:none;min-height:44px" data-act="hist-dl">下載</button>'+

    '<div class="sub" id="hcount" style="margin:4px 4px 8px"></div><div class="card" id="hlist"></div>';

function histFill(){
  const box=$('hlist');if(!box)return;
  const q=hq.trim().toLowerCase(),all=histKeys();
  const keys=q?all.filter(k=>S.history[k].text.toLowerCase().includes(q)):all;
  const re=q?new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'):null;
  $('hcount').textContent=!all.length?'':q?'找到 '+keys.length+' 天有「'+hq.trim()+'」':'共 '+all.length+' 天';
  if(!keys.length){box.innerHTML='<div class="empty"><b>'+(q?'🔎':'📜')+'</b>'+(q?'找不到符合的內容':'還沒有歷史紀錄。<br>今天的留言和日記，明天凌晨 3 點後就會出現在這裡。')+'</div>';return;}
  let y='',h='';
  keys.forEach(k=>{
    if(k.slice(0,4)!==y){y=k.slice(0,4);h+='<div class="hyear">【'+y+' 年】</div>';}

  });

/* 清除：刪掉雲端所有歷史紀錄文字（兩人都會清空），並記住清到哪一天，避免被自動整理又產生回來 */
function histClearAsk(){
  const n=histKeys().length;

  document.body.appendChild(a);a.click();a.remove();

/* 把本機版資料／備份檔合併上傳。不覆蓋雲端已有的內容：
   同 id 的紀錄、預約、特別日、留言略過；心情小記以較新的時間為準；暱稱與紀念日只補雲端空白的欄位 */
async function uploadAll(j){
  const ops=[],has=(arr,id)=>arr.some(x=>String(x.id)===String(id));
  ['records','bookings','specials'].forEach(n=>(j[n]||[]).forEach(o=>{
    if(o&&o.id&&DATE_RE.test(o.date||'')&&!has(S[n],o.id))ops.push([dref(n,String(o.id)),{...plain(o),ts:o.ts||Date.now()},false]);
  }));
  Object.entries(j.diary||{}).forEach(([k,v])=>{
    if(!DATE_RE.test(k)||!v)return;
    const list=Array.isArray(v.msgs)?v.msgs:['a','b'].filter(p=>typeof v[p]==='string'&&v[p].trim()).map(p=>({id:k+'-'+p,by:p,text:v[p].trim(),ts:0}));
    list.forEach(m=>{if(m&&m.id&&(m.text||'').trim()&&(m.by==='a'||m.by==='b')&&!has(S.msgs,m.id))
      ops.push([dref('msgs',String(m.id)),{date:k,by:m.by,text:m.text,ts:m.ts||0},false]);});
  });
  Object.entries(j.journal||{}).forEach(([k,v])=>{
    if(!DATE_RE.test(k)||!v)return;
    const x={};
    ['a','b'].forEach(p=>{const e=v[p],c=jOn(k)[p];if(e&&e.ts&&(!c||(e.ts||0)>(c.ts||0)))x[p]={text:e.text||'',mood:e.mood||'',ts:e.ts,hist:Array.isArray(e.hist)?e.hist:[]};});
    if(Object.keys(x).length)ops.push([dref('journal',k),x,true]);
  });
  const st=j.settings||{},cs=S.settings,dflt={a:'老公',b:'老婆'},sx={};
  ['a','b'].forEach(k=>{if(st[k]&&st[k]!==dflt[k]&&(!cs[k]||cs[k]===dflt[k]))sx[k]=st[k];});
  ['bda','bdb','wed','dat'].forEach(k=>{if(DATE_RE.test(st[k]||'')&&!cs[k])sx[k]=st[k];});
  if(Object.keys(sx).length)ops.push([spaceRef(),sx,true]);
  for(let i=0;i<ops.length;i+=400){
    const b=F.writeBatch(db);
    ops.slice(i,i+400).forEach(([r,d,m])=>m?b.set(r,d,{merge:true}):b.set(r,d));
    await b.commit();
  }
  return ops.length;
}
function importData(file){
  const fr=new FileReader();
  fr.onload=async()=>{
    let j;
    try{j=JSON.parse(fr.result);if(!j||!Array.isArray(j.records))throw 0;}catch(e){return toast('這不是有效的備份檔');}
    toast('上傳中…');
    try{const n=await uploadAll(j);toast(n?'匯入完成':'沒有新的內容需要匯入');}catch(e){console.error(e);toast('匯入失敗，請確認網路');}
  };
  fr.readAsText(file);
}
async function migrate(){
  const raw=lsGet(OLD_KEY),j=oldLocalData();if(!j)return;
  toast('上傳中…');
  try{const n=await uploadAll(j);lsSet(MIG_KEY,hash(raw));toast(n?'本機資料已上傳':'雲端已經有這些內容了');render();}
  catch(e){console.error(e);toast('上傳失敗，請確認網路');}
}
/* 上一版雲端的「共同日記」（diary：a/b 各一欄）自動轉成「有話要說」的留言 */
let legacyBusy=false;
async function convertLegacyDiary(docs){
  if(legacyBusy||!docs.length)return;
  legacyBusy=true;
  try{
    const b=F.writeBatch(db);
    docs.forEach(d=>{
      const v=d.data();
      ['a','b'].forEach(p=>{if(typeof v[p]==='string'&&v[p].trim())b.set(dref('msgs',d.id+'-'+p),{date:d.id,by:p,text:v[p].trim(),ts:0});});
      b.delete(dref('diary',d.id));
    });
    await b.commit();
  }catch(e){console.error(e);}
  legacyBusy=false;
}

  if(a!=='sheet-del')delArmed=false;

    case 'tab':tab=el.dataset.v;if(tab==='cal'){const s=parse(sel);calY=s.getFullYear();calM=s.getMonth();}render();window.scrollTo(0,tab==='hist'&&!hq.trim()?document.body.scrollHeight:0);break;
    case 'add-rec':recForm({id:uid(),date:d,time:'',dur:0,note:''},true);break;
    case 'edit-rec':{const r=find(S.records,id);if(!r)break;if(mineRec(r))recForm({...r},false);else viewRec(r);break;}
    case 'add-bk':bkForm({id:uid(),date:d,time:'',note:''},true);break;
    case 'edit-bk':{const b=find(S.bookings,id);if(b)bkForm({...b},false);break;}
    case 'j-edit':jForm(d);break;
    case 'j-hist':jHist(d,el.dataset.k);break;
    case 'j-mood':jMood=jMood===el.dataset.v?'':el.dataset.v;
      document.querySelectorAll('#sheet .mood').forEach(b=>b.classList.toggle('on',b.dataset.v===jMood));break;
    case 'chat-send':{
      const ta=el.closest('.chatin').querySelector('textarea'),t=ta.value.trim();
      if(!t)break;
      ta.value='';ta.style.height='44px';
      const mid=uid(),last=msgsOn(d).reduce((x,m)=>Math.max(x,m.ts||0),0);
      w(F.setDoc(dref('msgs',mid),{date:d,by:me,text:t,ts:Math.max(Date.now(),last+1)}));
      break;}
    case 'chat-del':{
      const m=S.msgs.find(x=>x.id===id);
      if(!m||m.by!==me)break;
      if(delMsg!==id||Date.now()-delAt>4000){delMsg=id;delAt=Date.now();toast('再點一次，刪除這則留言');break;}
      delMsg='';remove('msgs',id);toast('已刪除');break;}
    case 'add-sp':spForm({id:uid(),yearly:true},true);break;
    case 'edit-sp':{const s=find(S.specials,id);if(s)spForm({...s},false);break;}
    case 'pick-day':sel=d;if(el.dataset.go){tab='cal';const s=parse(d);calY=s.getFullYear();calM=s.getMonth();window.scrollTo(0,0);}render();showDay(d);break;
    case 'cal-prev':calM--;if(calM<0){calM=11;calY--;}render();break;
    case 'cal-next':calM++;if(calM>11){calM=0;calY++;}render();break;
    case 'st-prev':statY--;render();break;
    case 'st-next':statY++;render();break;
    case 'set-pin':pinForm();break;
    case 'export':exportData();break;
    case 'hist-dl':histDownload();break;
    case 'hist-clear':histClearAsk();break;
    case 'hist-clear-ok':histClear(el);break;
    case 'import':$('file').click();break;
    case 'migrate':migrate();break;
    case 'migrate-skip':{const raw=lsGet(OLD_KEY);if(raw)lsSet(MIG_KEY,hash(raw));render();break;}
    case 'logout':A.signOut(auth);break;
    case 'login':login();break;
    case 'sheet-save':if(sheetCb&&sheetCb.save&&sheetCb.save()===true)closeSheet();break;
    case 'sheet-close':closeSheet();break;
    case 'sheet-del':
      if(!delArmed){delArmed=true;el.textContent='再按一次確認刪除';}
      else{delArmed=false;sheetCb.del();toast('已刪除');closeSheet();}
      break;
    case 'unlock':unlock();break;
    case 'pin-setup':pinSetup();break;
    case 'mq-set':$('mqPanel').classList.toggle('on');break;
    case 'mq-login':$('mqLogin').style.display='block';$('pinIn').focus();break;
    case 'mq-color':case 'mq-bg':
      mq[a==='mq-color'?'color':'bg']=el.dataset.v;mqSave();mqApply();
      el.parentNode.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',b===el));break;
  }
});
document.addEventListener('input',e=>{if(e.target.id==='hq'){hq=e.target.value;histFill();}});
document.addEventListener('input',e=>{const t=e.target;if(t.closest&&t.closest('.chatin')){t.style.height='44px';t.style.height=Math.min(120,t.scrollHeight+2)+'px';}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='mqIn')mq.text=t.value;else if(t.id==='mqSpeed')mq.speed=+t.value;else if(t.id==='mqSize')mq.size=+t.value;else return;
  mqSave();mqApply();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&(t.dataset.set==='emja'||t.dataset.set==='emjb')){
    const v=t.value.trim()||(t.dataset.set==='emja'?'🍗':'🍉');setSettings({[t.dataset.set]:v});toast('已更新代表符號');}
  if(t.dataset&&['bda','bdb','wed','dat'].indexOf(t.dataset.set)>=0){
    const v=DATE_RE.test(t.value)?t.value:'';setSettings({[t.dataset.set]:v});toast(v?'已更新，並加入行事曆':'已清除');}
  if(t.dataset&&t.dataset.name){
    const k=t.dataset.name,v=t.value.trim()||(k==='a'?'老公':'老婆');setSettings({[k]:v});toast('已更新稱呼');}
  if(t.id==='file'&&t.files&&t.files[0]){importData(t.files[0]);t.value='';}
});

/* ---------- 密碼鎖：第一次打開強制設定 ---------- */
let lockMode='';
const LOGO='<div style="font-size:56px">🌭💞🙊</div><h1>我們的日子</h1>';
const pinInput=(id,ph)=>'<input id="'+id+'" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="'+ph+'">';
/* ---------- 偽裝首頁：跑馬燈小程式（設定 → 登入 → 輸入密碼才進入主程式） ---------- */
const MQ_KEY='marquee.cfg',MQ_COLORS=['#ffe14d','#ffffff','#ff5a7a','#4dd2ff','#6dff8a','#ff9f43'],MQ_BGS=['#000000','#12264d','#4a0d1c','#0f3d2e','#ffffff'];
let mq=Object.assign({text:'歡迎光臨 ✨ 全館 8 折',speed:5,size:5,color:'#ffe14d',bg:'#000000'},(()=>{try{return JSON.parse(localStorage.getItem(MQ_KEY))||{};}catch(e){return {};}})());
function mqSave(){try{localStorage.setItem(MQ_KEY,JSON.stringify(mq));}catch(e){}}
function mqApply(){
  const t=$('mqText');if(!t)return;
  t.textContent=mq.text||' ';t.style.color=mq.color;t.style.fontSize=(10+mq.size*5)+'vmin';
  $('lock').style.background=mq.bg;
  const dist=t.offsetWidth+innerWidth;
  t.style.animation='none';void t.offsetWidth;
  t.style.animation='mq '+(dist/(60+mq.speed*40)).toFixed(2)+'s linear infinite';
}
function mqHtml(){
  const sw=(list,cur,act)=>'<div class="mqrow">'+list.map(c=>'<button class="sw'+(c===cur?' on':'')+'" style="background:'+c+'" data-act="'+act+'" data-v="'+c+'" aria-label="'+c+'"></button>').join('')+'</div>';
  return '<div class="mqstage"><span id="mqText"></span></div>'+
    '<button class="mqgear" data-act="mq-set" aria-label="設定">⚙️</button>'+
    '<div class="mqhint">把手機橫放，效果更好</div>'+
    '<div class="mqpanel" id="mqPanel"><div class="mqrow" style="justify-content:space-between"><h3>跑馬燈設定</h3><button class="btn sm plain" data-act="mq-set">完成</button></div>'+
    '<label>顯示文字</label><input id="mqIn" type="text" maxlength="200" value="'+esc(mq.text)+'">'+
    '<label>速度</label><input id="mqSpeed" type="range" min="1" max="10" value="'+mq.speed+'">'+
    '<label>字體大小</label><input id="mqSize" type="range" min="1" max="10" value="'+mq.size+'">'+
    '<label>文字顏色</label>'+sw(MQ_COLORS,mq.color,'mq-color')+
    '<label>背景顏色</label>'+sw(MQ_BGS,mq.bg,'mq-bg')+
    '<div class="mqrow" style="justify-content:space-between;margin-top:20px;border-top:1px solid #33333a;padding-top:14px">'+
      '<span style="color:#aaa;font-size:14px">帳號</span><button class="btn sm plain" data-act="mq-login">登入</button></div>'+
    '<div id="mqLogin" style="display:none"><label>密碼</label><div class="mqrow" style="flex-wrap:nowrap">'+pinInput('pinIn','')+
      '<button class="btn sm" style="background:#ffe14d;color:#000;flex:none;min-height:46px" data-act="unlock">確認</button></div></div>'+
    '<div style="color:#666;font-size:12px;text-align:center;margin-top:18px">字幕跑馬燈 v1.2</div></div>';
}
addEventListener('resize',()=>{if(lockMode==='decoy')mqApply();});
function showLock(mode){
  lockMode=mode;
  $('lock').classList.toggle('mq',mode==='decoy');
  $('lock').style.background='';
  if(mode==='decoy'){$('lock').innerHTML=mqHtml();$('lock').classList.add('on');mqApply();return;}
  $('lock').innerHTML=LOGO+(
    mode==='setup'?'<div class="sub">第一次使用，請先設定這支手機的進入密碼<br>（4–8 位數字）</div>'+pinInput('pin1','設定密碼')+pinInput('pin2','再輸入一次')+
      '<button class="btn" data-act="pin-setup">設定並進入</button><div class="sub" style="font-size:12px">之後打開 App 會先看到「字幕跑馬燈」，<br>點右上角 ⚙️ → 登入 → 輸入密碼才會進入</div>':
    '<div class="sub">請輸入密碼</div>'+pinInput('pinIn','')+'<button class="btn" data-act="unlock">解鎖</button>');
  $('lock').classList.add('on');
}
function hideLock(){$('lock').classList.remove('mq');$('lock').style.background='';lockMode='';$('lock').classList.remove('on');$('lock').innerHTML='';render();}
function pinSetup(){
  const p=$('pin1').value.trim();
  if(!/^\d{4,8}$/.test(p))return toast('請輸入 4–8 位數字');
  if(p!==$('pin2').value.trim())return toast('兩次輸入的密碼不一樣');
  lsSet(PIN_KEY,p);hideLock();toast('密碼設定完成');
}
function unlock(){
  if($('pinIn').value===getPin())hideLock();
  else{$('pinIn').value='';toast('密碼不正確');}
}
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.id==='pinIn')unlock();
  if(e.target.id==='pin2')pinSetup();
});
function lockIfNeeded(){
  if(!getPin()){if(lockMode!=='setup')showLock('setup');return;}
  if(lockMode!=='decoy')showLock('decoy');
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)lockIfNeeded();
  else{archiveDue();if(me&&started&&!$('mask').classList.contains('on'))render();}
});
const setOffline=()=>$('offline').classList.toggle('on',!navigator.onLine);
addEventListener('online',setOffline);addEventListener('offline',setOffline);setOffline();

/* ---------- Google 登入畫面 ---------- */
const G_ICON='<svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>';
function gate(state,msg){
  const g=$('gate');
  if(state==='off'){g.classList.add('off');return;}
  g.classList.remove('off');
  if(state==='loading')g.innerHTML='<div class="spin"></div><div class="sub">'+(msg||'載入中…')+'</div>';
  else if(state==='setup')g.innerHTML=LOGO+'<div class="note">尚未設定 Firebase。<br>請依照 README 的步驟，把設定貼到 <b>firebase-config.js</b>。</div>';
  else if(state==='login'){
    const inApp=/FBAN|FBAV|Instagram|Line\//i.test(navigator.userAgent);
    g.innerHTML=LOGO+'<div class="sub">兩個人的小天地，請先登入</div>'+
      '<button class="gbtn" data-act="login">'+G_ICON+'使用 Google 帳號登入</button>'+
      (inApp?'<div class="note" style="color:var(--rose)">偵測到 App 內建瀏覽器，Google 可能會拒絕登入。請點右上角選單，改用 Safari 或 Chrome 開啟。</div>':'')+
      (msg?'<div class="note">'+esc(msg)+'</div>':'');
  }
  else if(state==='denied')g.innerHTML=LOGO+'<div class="note">'+esc(myEmail)+'<br>這個帳號沒有權限使用。<br>請換成你們兩人設定好的 Google 帳號。</div>'+
      '<button class="btn plain" data-act="logout">換一個帳號</button>';
  else if(state==='error')g.innerHTML=LOGO+'<div class="note">'+esc(msg||'發生錯誤')+'</div><button class="btn plain" onclick="location.reload()">重新整理</button>';
}

/* ---------- Firebase 連線 ---------- */
const LISTENERS=8;
let unsubs=[],got=new Set(),started=false;
function stopListen(){unsubs.forEach(u=>u());unsubs=[];got=new Set();started=false;S=def();}
function onErr(e){
  console.error(e);
  if(e.code==='permission-denied'){stopListen();gate('denied');}
  else toast('同步中斷，請檢查網路');
}
function changed(n){
  got.add(n);
  if(got.size<LISTENERS)return;
  if(!started){started=true;gate('off');render();archiveDue();return;}
  refresh();
}
function listen(){
  stopListen();
  ['records','bookings','specials','msgs'].forEach(n=>unsubs.push(F.onSnapshot(col(n),snap=>{
    S[n]=snap.docs.map(d=>({...d.data(),id:d.id}));changed(n);},onErr)));
  unsubs.push(F.onSnapshot(col('journal'),snap=>{
    const o={};snap.docs.forEach(d=>{o[d.id]=d.data();});S.journal=o;changed('journal');},onErr));
  unsubs.push(F.onSnapshot(col('history'),snap=>{
    const o={};snap.docs.forEach(d=>{o[d.id]=d.data();});S.history=o;changed('history');},onErr));
  unsubs.push(F.onSnapshot(col('diary'),snap=>{convertLegacyDiary(snap.docs);changed('diary');},onErr));
  unsubs.push(F.onSnapshot(spaceRef(),snap=>{
    S.settings=Object.assign(def().settings,snap.exists()?snap.data():{});changed('settings');},onErr));
}
async function login(){
  const p=new A.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
  try{await A.signInWithPopup(auth,p);}
  catch(e){
    if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'){
      try{await A.signInWithRedirect(auth,p);}catch(e2){gate('login','登入失敗：'+e2.code);}
    }else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')gate('login','登入失敗：'+e.code);
  }
}
async function boot(){
  lockIfNeeded();
  if(!firebaseConfig||!firebaseConfig.apiKey||/^YOUR/i.test(firebaseConfig.apiKey))return gate('setup');
  try{
    const [appM,authM,fsM]=await Promise.all([import(FB+'firebase-app.js'),import(FB+'firebase-auth.js'),import(FB+'firebase-firestore.js')]);
    A=authM;F=fsM;
    const app=appM.initializeApp(firebaseConfig);
    auth=A.getAuth(app);
    try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})});}
    catch(e){db=F.getFirestore(app);}
  }catch(e){console.error(e);return gate('error','無法載入，請確認網路連線後重新整理。');}
  A.getRedirectResult(auth).catch(e=>console.warn(e));
  const ma=String(MEMBERS.a||'').trim().toLowerCase(),mb=String(MEMBERS.b||'').trim().toLowerCase();
  A.onAuthStateChanged(auth,u=>{
    if(!u){stopListen();me=null;myEmail='';$('mask').classList.remove('on');$('view').innerHTML='';gate('login');return;}
    myEmail=(u.email||'').toLowerCase();
    me=myEmail===ma?'a':myEmail===mb?'b':null;
    if(!me){stopListen();return gate('denied');}
    gate('loading','同步資料中…');
    listen();
  });
}
boot();

if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
